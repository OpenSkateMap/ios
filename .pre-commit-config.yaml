# Install once: `pre-commit install` (pre-commit is pinned in .mise.toml).
repos:
    - repo: local
      hooks:
          - id: swiftformat
            name: swiftformat
            entry: mise run -o quiet ios:format --
            language: system
            files: \.swift$
            exclude: ^(Core/Foundation/APIClientKit/Sources/Generated/|Lint/fixtures/|Tuist/\.build/)|(^|/)Derived/
          - id: swiftlint
            name: swiftlint custom rules
            entry: mise run -o quiet ios:lint --
            language: system
            files: (\.swift|^\.swiftlint\.yml|^\.mise/tasks/ios/lint)$
            exclude: ^(Core/Foundation/APIClientKit/Sources/Generated/|Tuist/\.build/)|(^|/)Derived/
          - id: generated-api-client
            name: generated API client matches openapi.json
            entry: mise run -o quiet ios:generate-api -- --check
            language: system
            pass_filenames: false
            files: ^(Core/Foundation/APIClientKit/(openapi\.json|openapi-generator-config\.yaml|Sources/Generated/.*)|\.mise/tasks/ios/generate-api)$
          - id: check-translations
            name: every language has every English string
            entry: mise run -o quiet ios:check-translations
            language: system
            pass_filenames: false
            files: (\.lproj/.*\.(strings|stringsdict)|^Tuist/ProjectDescriptionHelpers/Resources\.swift|^\.mise/tasks/ios/check-translations)$
          # CLAUDE.md files are symlinks; pre-commit's default `types: [file]` filters symlinks out.
          - id: verify-docs
            name: docs name real modules, symlinks, complete index
            entry: mise run -o quiet repo:verify-docs
            language: system
            pass_filenames: false
            types: []
            types_or: [file, symlink]
            files: ((^|/)(AGENTS|CLAUDE|README)\.md|^\.docs/.*\.md|/Project\.swift|^Tuist/Package\.swift|^\.mise/tasks/repo/verify-docs)$
          - id: verify-modules
            name: dependencies point down, features stay apart, declared and used
            entry: mise run -o quiet repo:verify-modules
            language: system
            pass_filenames: false
            files: (/Project\.swift|/Sources/.*\.swift|^\.mise/tasks/repo/verify-modules)$
