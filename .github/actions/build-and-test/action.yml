name: Build and test
description: Generates the workspace, builds on the cached DerivedData (keyed by the Xcode build and the manifests) and runs the chosen tests.
inputs:
  tests:
    description: xcodebuild's test selection, such as `-skip-testing-tags snapshot`
    required: true
runs:
  using: composite
  steps:
    - name: The Xcode build, the manifests and the simulator
      id: keys
      shell: bash
      env:
        MANIFESTS: ${{ hashFiles('.mise.toml', 'Tuist.swift', 'Workspace.swift', '**/Project.swift', 'Tuist/Package.swift', 'Tuist/Package.resolved', 'Tuist/ProjectDescriptionHelpers/**', 'Tuist/ResourceSynthesizers/**', 'xcconfigs/**', '!Tuist/.build/**') }}
      run: |
        echo "xcode=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
        echo "manifests=$MANIFESTS" >> "$GITHUB_OUTPUT"
        echo "DERIVED_DATA=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
        echo "SIMULATOR_ID=$(mise run -q ios:simulator-id)" >> "$GITHUB_ENV"
    - name: Generate the workspace
      shell: bash
      run: |
        tuist install
        tuist generate --no-open
    # Every key starts with the Xcode build, so one Xcode never builds on another's products.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: derived-data
      with:
        path: |
          ${{ runner.temp }}/DerivedData
          !${{ runner.temp }}/DerivedData/Logs
        key: derived-data-${{ steps.keys.outputs.xcode }}-${{ steps.keys.outputs.manifests }}-${{ github.sha }}
        restore-keys: |
          derived-data-${{ steps.keys.outputs.xcode }}-${{ steps.keys.outputs.manifests }}-
          derived-data-${{ steps.keys.outputs.xcode }}-
    - name: Let the build reuse the cached DerivedData
      shell: bash
      run: mise run ios:ci-reuse-build
    # Tuist reads CI from the environment and turns Swift warnings into errors for this build.
    - name: Build for testing
      shell: bash
      run: |
        set -o pipefail
        # A fixed environment: GitHub's per-run variables (run id, sha) reach every task as build settings and re-run them.
        env -i HOME="$HOME" PATH="$PATH" USER="$USER" TMPDIR="${TMPDIR:-/tmp}" DEVELOPER_DIR="$DEVELOPER_DIR" LANG=en_US.UTF-8 \
          xcodebuild -workspace OpenSkateMap.xcworkspace -scheme OpenSkateMap -destination "id=$SIMULATOR_ID" \
          -derivedDataPath "$DERIVED_DATA" -quiet build-for-testing COMPILER_INDEX_STORE_ENABLE=NO
    # main keeps the cache current; a pull request saves only when it found none, so it never evicts main's.
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: github.event_name != 'pull_request' || steps.derived-data.outputs.cache-matched-key == ''
      with:
        path: |
          ${{ runner.temp }}/DerivedData
          !${{ runner.temp }}/DerivedData/Logs
        key: ${{ steps.derived-data.outputs.cache-primary-key }}
    # A device's first boot sets up its data for minutes and stalls whatever runs beside it; a booted device's data, kept
    # per Xcode, runner image and device (saved once, by whichever run finds none), boots in seconds. Booted after the build.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: simulator
      with:
        path: ~/Library/Developer/CoreSimulator/Devices/${{ env.SIMULATOR_ID }}/data
        key: simulator-${{ steps.keys.outputs.xcode }}-${{ env.ImageVersion }}-${{ env.SIMULATOR_ID }}
    - name: Boot the simulator
      shell: bash
      run: xcrun simctl bootstatus "$SIMULATOR_ID" -b
    - name: Test
      shell: bash
      env:
        TESTS: ${{ inputs.tests }}
      run: |
        set -o pipefail
        # Word splitting is wanted: TESTS holds xcodebuild arguments.
        xcodebuild -workspace OpenSkateMap.xcworkspace -scheme OpenSkateMap -destination "id=$SIMULATOR_ID" \
          -derivedDataPath "$DERIVED_DATA" -quiet test-without-building $TESTS
    - name: Shut the simulator down to keep its data
      if: steps.simulator.outputs.cache-hit != 'true'
      shell: bash
      run: xcrun simctl shutdown "$SIMULATOR_ID"
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: steps.simulator.outputs.cache-hit != 'true'
      with:
        path: ~/Library/Developer/CoreSimulator/Devices/${{ env.SIMULATOR_ID }}/data
        key: ${{ steps.simulator.outputs.cache-primary-key }}
