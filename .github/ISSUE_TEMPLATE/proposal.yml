name: Proposal
description: A new feature, or a change to how the app looks or behaves. Agree on it here before writing code.
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What's hard or missing today, and for whom.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd change. Sketches or screenshots welcome.
    validations:
      required: true
