name: Bug report
description: Something in the app doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots or a screen recording help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Discover
        2. Tap a pin
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Profile → the bottom of the list.
      placeholder: 1.0 (20261019.1200)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPhone 17 Pro, iOS 26.1
    validations:
      required: true
