name: release
# A tag vX.Y.Z uploads that commit to App Store Connect as version X.Y.Z (`mise run ios:release`, `.docs/commands.md`);
# it then appears in TestFlight. Tag the commit you mean to ship: `git tag v1.0.0 && git push origin v1.0.0`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    runs-on: xcode-27
    # Every secret below lives in the release environment, not the repository.
    environment: release
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.8 # pinned: the same mise everywhere, not whatever is newest
      - name: The App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_PRIVATE_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: The CI signing identity
        env:
          CI_SIGNING_P12: ${{ secrets.CI_SIGNING_P12 }}
          CI_SIGNING_P12_PASSWORD: ${{ secrets.CI_SIGNING_P12_PASSWORD }}
        run: mise run ios:ci-keychain
      - name: The sign-in footage (private R2 bucket)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: mise run ios:fetch-assets -- --require
      - name: Archive and upload
        run: |
          set -o pipefail
          mise run ios:release | tee "$RUNNER_TEMP/release.log"
          grep '^Uploaded' "$RUNNER_TEMP/release.log" >> "$GITHUB_STEP_SUMMARY"
