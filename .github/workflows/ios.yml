name: ios
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # The required check: every test but the snapshots (the snapshots workflow runs them).
    name: iOS Gate
    # Xcode 27's image, a preview as of 2026-10.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      # Xcode 27.0, as locally: the snapshots are recorded on its iOS 27.0 simulator, and the image's default Xcode moves on.
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit before this one: what the API client check compares against.
          fetch-depth: 2
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.8 # pinned: the same mise everywhere, not whatever is newest
      - name: Lint (custom rules, proven against the fixtures)
        run: mise run ios:lint
      - name: Format
        run: mise run ios:format -- --lint
      - name: Docs, symlinks and the AGENTS.md index
        run: mise run repo:verify-docs
      - name: The module graph (tiers, features apart, no unused or undeclared dependencies)
        run: mise run repo:verify-modules
      # The same files as the pre-commit hook's; a pull request's checkout is the merge, whose first parent is the base.
      - name: Whether the API contract or the generated client changed
        id: api
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || git diff --name-only HEAD^1 HEAD | grep -qE \
            '^(Core/Foundation/APIClientKit/(openapi\.json|openapi-generator-config\.yaml|Sources/Generated/.*)|\.mise/tasks/ios/generate-api)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.api.outputs.changed
        with:
          path: .swift-openapi-generator
          key: swift-openapi-generator-${{ hashFiles('.mise/tasks/ios/generate-api') }}
      - name: The generated API client matches openapi.json
        if: steps.api.outputs.changed
        run: mise run ios:generate-api -- --check
      - uses: ./.github/actions/build-and-test
        with:
          tests: -skip-testing-tags snapshot
