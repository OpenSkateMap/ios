name: speedflight
# A signed ad hoc build of the chosen branch on speedflight.dev, installable from Safari on any iPhone registered to
# the personal team (`mise run ios:speedflight`, `.docs/commands.md`). Run it from the Actions tab or
# `gh workflow run speedflight --ref <branch> -f title="…" -f notes="…"`; it never runs on its own.
on:
  workflow_dispatch:
    inputs:
      title:
        description: "One line, what this build is (default: the commit's subject)"
        required: false
      notes:
        description: "What changed and what to test (default: the commit's body)"
        required: false

permissions:
  contents: read

concurrency:
  group: speedflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  share:
    name: Cut and share
    runs-on: xcode-27
    # Every secret below lives in the release environment, not the repository.
    environment: release
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      SPEEDFLIGHT_SECRET: ${{ secrets.SPEEDFLIGHT_SECRET }}
      SPEEDFLIGHT_DEEP_LINK: ${{ vars.SPEEDFLIGHT_DEEP_LINK }}
      SPEEDFLIGHT_AUTHOR: ${{ github.actor }}
      TITLE: ${{ inputs.title }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.8 # pinned: the same mise everywhere, not whatever is newest
      - name: The App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_PRIVATE_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: The CI signing identity
        env:
          CI_SIGNING_P12: ${{ secrets.CI_SIGNING_P12 }}
          CI_SIGNING_P12_PASSWORD: ${{ secrets.CI_SIGNING_P12_PASSWORD }}
        run: mise run ios:ci-keychain
      - name: The sign-in footage (private R2 bucket)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: mise run ios:fetch-assets -- --require
      - name: Cut and share
        run: |
          set -o pipefail
          title="${TITLE:-$(git log -1 --format=%s)}"
          notes="${NOTES:-$(git log -1 --format=%b)}"
          mise run ios:speedflight -- "$title" "${notes:-$title}" | tee "$RUNNER_TEMP/speedflight.log"
          grep '^Build page:' "$RUNNER_TEMP/speedflight.log" >> "$GITHUB_STEP_SUMMARY"
