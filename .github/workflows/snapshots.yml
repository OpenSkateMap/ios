name: snapshots
# The snapshot tests (tagged `snapshot`), which the required iOS Gate skips: on pull requests that change what they draw
# or how they're drawn, and from the Actions tab (`gh workflow run snapshots --ref <branch>`). Not a required check.
on:
  pull_request:
    paths:
      - "Features/**"
      - "Core/UI/**"
      - "**/__Snapshots__/**"
      # The test language and region, the package versions (SnapshotTesting, PinLayout) and the runtime CI picks.
      - "Tuist/ProjectDescriptionHelpers/**"
      - "Tuist/Package.swift"
      - "Tuist/Package.resolved"
      - "Workspace.swift"
      - ".mise/tasks/ios/simulator-id"
      - ".github/workflows/snapshots.yml"
      - ".github/actions/build-and-test/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshots:
    name: Snapshots
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      # Xcode 27.0, as locally: the snapshots are recorded on its iOS 27.0 simulator, and the image's default Xcode moves on.
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.8 # pinned: the same mise everywhere, not whatever is newest
      - uses: ./.github/actions/build-and-test
        env:
          TEST_RUNNER_SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/snapshots
        with:
          tests: -only-testing-tags snapshot
      - name: The images of failed snapshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
